# Keeps the commit-pinned GitHub Actions in the test workflow and the one
# test-only npm dependency (ws, used by the brainstorm-server tests) current.
# The plugin itself has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
  - package-ecosystem: npm
    directory: /tests/brainstorm-server
    schedule:
      interval: weekly
    commit-message:
      prefix: test
    labels:
      - dependencies
